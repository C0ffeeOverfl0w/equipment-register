name: equipment-register
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: equipment
      POSTGRES_USER: equipment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equipment_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - equipment-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  equipment-data:
